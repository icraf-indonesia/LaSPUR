name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      # set up R matching the version in renv.lock
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'renv'
          use-public-rspm: true

      # install Linux system dependencies required by R packages
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libgdal-dev \
            libgeos-dev \
            libglpk-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            libpng-dev \
            libproj-dev \
            libsqlite3-dev \
            libssl-dev \
            libtiff-dev \
            libudunits2-dev \
            libxml2-dev \
            make \
            pandoc \
            zlib1g-dev

      # set up renv and restore the project library from renv
      - uses: r-lib/actions/setup-renv@v2

      # run the tests
      - name: Run R tests
        run: Rscript -e 'testthat::test_dir("tests/testthat")'