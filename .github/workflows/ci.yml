name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      # set up R
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      # set up renv and restore the project library from renv
      - uses: r-lib/actions/setup-renv@v2

      # run the tests
      - name: Run R tests
        run: Rscript -e 'testthat::test_dir("tests/testthat")'